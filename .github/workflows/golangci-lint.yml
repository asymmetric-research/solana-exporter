name: golangci-lint

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  filter:
    runs-on: ubuntu-latest
    name: Filter run on Go src
    permissions:
      contents: read
      pull-requests: read
    outputs:
      is-go-pr: ${{ steps.filter.outputs.is-go-pr }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Path Filter
        id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            is-go-pr:
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
              - '.golangci.yml'

  version-sync:
    name: golangci-lint version sync
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: Check golangci-lint version matches tools/go.mod
        run: |
          tools_ver=$(grep -oE 'github\.com/golangci/golangci-lint/v2 v[0-9]+\.[0-9]+\.[0-9]+' tools/go.mod | awk '{print $2}')
          wf_ver=$(grep -oE 'version: v[0-9]+\.[0-9]+\.[0-9]+' .github/workflows/golangci-lint.yml | awk '{print $2}')
          echo "tools/go.mod:  $tools_ver"
          echo "workflow:      $wf_ver"
          if [ -z "$tools_ver" ] || [ -z "$wf_ver" ]; then
            echo "::error::Could not extract golangci-lint version from one of the files."
            exit 1
          fi
          if [ "$tools_ver" != "$wf_ver" ]; then
            echo "::error::golangci-lint version mismatch: tools/go.mod pins $tools_ver but the workflow uses $wf_ver. Keep them in sync (see comment above the 'version:' key)."
            exit 1
          fi
          echo "Versions are in sync ($tools_ver)."

  golangci:
    name: golangci-lint
    runs-on: ubuntu-latest
    needs: [filter]
    if: needs.filter.outputs.is-go-pr == 'true'
    permissions:
      contents: read
      pull-requests: read
      checks: write
    env:
      CGO_ENABLED: 0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: go.mod
      - name: golangci-lint
        uses: golangci/golangci-lint-action@82606bf257cbaff209d206a39f5134f0cfbfd2ee # v9.2.1
        with:
          # Keep this in sync with the version pinned in tools/go.mod.
          # Check the pinned version with:
          #   go tool -modfile=tools/go.mod golangci-lint version
          # And update it with:
          #   cd tools && go get -tool github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.10.1
          version: v2.10.1
          only-new-issues: true
